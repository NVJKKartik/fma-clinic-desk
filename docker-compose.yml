services:
  agent:
    build: .
    command: python agent.py
    environment:
      PORT: "8080"
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      TOOLS_API_URL: http://tools-api:8081
    ports:
      - "8080:8080"
    depends_on:
      - tools-api
  tools-api:
    build: .
    command: python tools_api/server.py
    environment:
      PORT: "8081"
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
    ports:
      - "8081:8081"
    depends_on:
      - postgres
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
