services:
  agent:
    build: .
    command: python agent.py
    environment:
      PORT: "8080"
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      TOOLS_API_URL: http://tools-api:8081
    ports:
      - "8080:8080"
    depends_on:
      - tools-api
  tools-api:
    build: ./tools_api
    command: python server.py
    environment:
      PORT: "8081"
    ports:
      - "8081:8081"
