# The whole order desk: `docker compose up --build`. The agent can't run on its own: every tool it has is a call to
# the tools service, which keeps the shop's records in Postgres.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      # *.sql here run in filename order on first boot only.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  tools-api:
    build: ./tools-api
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
    ports:
      - "18081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent:
    build: .
    environment:
      PORT: "8080"
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      # The agent reaches the shop only through the tools service.
      TOOLS_API_URL: http://tools-api:8080
    ports:
      - "8080:8080"
    depends_on:
      tools-api:
        condition: service_healthy
